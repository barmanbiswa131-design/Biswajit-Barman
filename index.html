<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiswaTube</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#111;padding:16px;z-index:5;border-bottom:1px solid #222}h1{margin:0 0 12px;font-size:28px}
.row{display:flex;gap:8px}.row input{flex:1;padding:13px;border:0;border-radius:8px;background:#292929;color:#fff;font-size:16px;outline:none}.row button{padding:0 16px;border:0;border-radius:8px;background:#e00000;color:#fff;font-weight:bold}
.chips{display:flex;gap:8px;overflow:auto;margin-top:12px}.chips button{white-space:nowrap;border:1px solid #555;background:#222;color:#fff;border-radius:20px;padding:8px 14px}
main{padding:16px;max-width:900px;margin:auto}.msg{padding:32px 5px;color:#aaa}.section{font-size:21px;font-weight:bold;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#181818;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #000}
.thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#333}.info{padding:12px}.title{font-size:16px;font-weight:bold;line-height:1.35}.channel{color:#aaa;margin:7px 0 10px;font-size:13px}.watch{background:#e00000;color:#fff;border:0;border-radius:7px;padding:9px 13px;font-weight:bold}
#player{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:20;overflow:auto;padding:18px}
.playerbox{width:min(1100px,100%);margin:0 auto;background:#101010;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #000}
.playerbar{height:58px;display:flex;align-items:center;padding:0 16px;background:linear-gradient(135deg,#181818,#0d0d0d);position:sticky;top:0;z-index:2}
.playerbrand{font-size:20px;font-weight:800}.playerbrand span{color:#ff2020}
.close{margin-left:auto;width:42px;height:42px;border:0;border-radius:50%;background:#292929;color:#fff;font-size:22px}
.video-wrap{background:#000;aspect-ratio:16/9;width:100%}
.frame{width:100%;height:100%;border:0;display:block}
.player-info{padding:16px 18px 8px}.player-title{font-size:20px;font-weight:800;line-height:1.3}.player-channel{color:#aaa;margin-top:6px}
.player-actions{display:flex;gap:8px;flex-wrap:wrap;padding:8px 18px 16px}.pbtn{border:1px solid #333;background:#202020;color:#fff;border-radius:22px;padding:10px 15px;font-weight:700}
.suggest-title{font-size:20px;font-weight:800;padding:10px 18px 14px;border-top:1px solid #242424}
.suggest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:0 18px 20px}
.suggest-card{background:#191919;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #242424}.suggest-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.suggest-card .si{padding:10px}.suggest-card .st{font-weight:700;line-height:1.3;font-size:14px}.suggest-card .sc{color:#999;font-size:12px;margin-top:5px}
@media(max-width:600px){#player{padding:0;background:#000}.playerbox{border:0;border-radius:0;min-height:100%}.playerbar{height:54px}.player-title{font-size:17px}.player-actions{padding-bottom:12px}.suggest-grid{grid-template-columns:1fr 1fr;padding:0 10px 18px}.suggest-title{padding-left:10px}.player-info{padding:14px 12px 6px}}

</style>
</head>
<body>
<header>
<h1>▶ BiswaTube</h1>
<div class="row"><input id="q" placeholder="Search YouTube videos" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">SEARCH</button></div>
<div class="chips">
<button onclick="setQ('popular music')">Music</button><button onclick="setQ('gaming')">Gaming</button><button onclick="setQ('popular movies trailers')">Movies</button><button onclick="setQ('sports highlights')">Sports</button><button onclick="setQ('funny videos')">Funny</button>
</div>
</header>
<main id="results"><div class="msg">BiswaTube is ready. Search for a video.</div></main>
<div id="player">
<div class="playerbox">
  <div class="playerbar"><div class="playerbrand">▶ <span>Biswa</span>Tube</div><button class="close" onclick="closePlayer()">✕</button></div>
  <div class="video-wrap"><iframe id="frame" class="frame" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>
  <div class="player-info"><div id="playerTitle" class="player-title">BiswaTube Player</div><div id="playerChannel" class="player-channel"></div></div>
  <div class="player-actions"><button class="pbtn">👍 Like</button><button class="pbtn">↗ Share</button><button class="pbtn">🔖 Save</button><button class="pbtn">▶ Subscribe</button></div>
  <div class="suggest-title">Suggested Videos</div>
  <div id="suggestions" class="suggest-grid"></div>
</div>
</div>
<script>
const API_KEY='AIzaSyBkmGRMcQog-vOPIJye4ne1ssg3qGeYQDw';

let currentItems=[];
function setQ(x){document.getElementById('q').value=x;search()}
function renderSuggestions(currentId){
  const box=document.getElementById('suggestions'); if(!box)return; box.innerHTML='';
  currentItems.filter(v=>v.id.videoId!==currentId).slice(0,8).forEach(v=>{
    const id=v.id.videoId,s=v.snippet;
    const c=document.createElement('div'); c.className='suggest-card';
    c.innerHTML='<img src="'+(s.thumbnails.medium?.url||s.thumbnails.high?.url||'')+'"><div class="si"><div class="st"></div><div class="sc"></div></div>';
    c.querySelector('.st').textContent=s.title;c.querySelector('.sc').textContent=s.channelTitle;
    c.onclick=()=>openPlayer(id,s.title,s.channelTitle);box.appendChild(c);
  });
}
function openPlayer(id,title='',channel=''){
      document.getElementById('frame').src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';
      document.getElementById('playerTitle').textContent=title||'BiswaTube Player';
      document.getElementById('playerChannel').textContent=channel||'';
      document.getElementById('player').style.display='block';
      renderSuggestions(id);
    }
function closePlayer(){document.getElementById('frame').src='';document.getElementById('player').style.display='none'}
function card(v){
 const id=v.id.videoId,s=v.snippet;
 const c=document.createElement('div');c.className='card';
 c.innerHTML='<img class="thumb" src="'+(s.thumbnails.high?.url||s.thumbnails.medium?.url||'')+'"><div class="info"><div class="title"></div><div class="channel"></div><button class="watch">▶ WATCH</button></div>';
 c.querySelector('.title').textContent=s.title;c.querySelector('.channel').textContent=s.channelTitle;c.querySelector('.watch').onclick=()=>openPlayer(id,s.title,s.channelTitle);
 return c
}
async function api(q,max=12){
 const u=new URL('https://www.googleapis.com/youtube/v3/search');
 u.searchParams.set('part','snippet');u.searchParams.set('type','video');u.searchParams.set('q',q);u.searchParams.set('maxResults',max);u.searchParams.set('key',API_KEY);
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);
 try{const r=await fetch(u,{signal:controller.signal});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'YouTube API error');return d.items||[]}
 finally{clearTimeout(timer)}
}
async function search(){
 const q=document.getElementById('q').value.trim();if(!q)return;
 const out=document.getElementById('results');out.innerHTML='<div class="msg">Searching YouTube…</div>';
 try{const items=await api(q);render('Search results',items)}catch(e){out.innerHTML='<div class="msg">Search failed: '+(e.name==='AbortError'?'Request timed out. Check the API key and restrictions.':e.message)+'</div>'}
}
function render(title,items){
 currentItems=items;
 const out=document.getElementById('results');out.innerHTML='<div class="section">'+title+'</div>';
 const grid=document.createElement('div');grid.className='grid';items.forEach(v=>grid.appendChild(card(v)));out.appendChild(grid);
 if(!items.length)out.innerHTML+='<div class="msg">No videos found.</div>'
}
</script>
</body></html>
