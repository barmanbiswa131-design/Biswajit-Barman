<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiswaTube</title>
<style>
*{box-sizing:border-box}
:root{--bg:#111119;--panel:#1b1b25;--muted:#9696a3;--text:#f7f7fa;--accent:#ffbd45;--red:#e50914}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;background:linear-gradient(180deg,#111119 72%,rgba(17,17,25,.92));padding:18px 18px 12px;z-index:30;border:0;box-shadow:0 8px 30px rgba(0,0,0,.28)}
h1{display:none}
.row{display:flex;gap:9px;align-items:center}.row input{flex:1;height:52px;padding:0 20px;border:0;border-radius:30px;background:#25252e;color:#fff;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}.row input::placeholder{color:#a1a1ad}.row button{height:52px;width:54px;border:0;border-radius:50%;background:#25252e;color:#fff;font-size:0;position:relative}.row button:before{content:"⌕";font-size:31px;line-height:1}
.chips{display:flex;gap:27px;overflow:auto;margin-top:17px;padding:0 3px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{white-space:nowrap;border:0;background:none;color:#9a9aa5;font-size:17px;font-weight:700;padding:5px 0;position:relative}.chips button:first-child{color:#fff}.chips button:first-child:after{content:"";position:absolute;height:4px;width:28px;background:var(--accent);border-radius:4px;left:50%;bottom:-7px;transform:translateX(-50%)}
main{padding:0 0 92px;max-width:1050px;margin:auto}.msg{padding:32px 18px;color:#aaa}.section{font-size:22px;font-weight:800;margin:25px 18px 15px}.hero{height:min(600px,72vh);min-height:430px;position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:linear-gradient(180deg,#20202a,#111119)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,25,0) 25%,rgba(17,17,25,.05) 45%,#111119 96%);pointer-events:none}.hero-content{position:absolute;left:22px;right:22px;bottom:24px;z-index:2}.hero-title{font-size:38px;font-weight:900;line-height:1.05;text-shadow:0 4px 20px #000}.hero-sub{color:#ddd;margin-top:10px;font-size:14px}.hero-play{margin-top:17px;background:#19191d;border:1px solid rgba(255,210,120,.7);color:#fff;border-radius:32px;padding:15px 28px;font-size:17px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 18px}.card{background:#181820;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.28);border:1px solid #252530;cursor:pointer}.thumb{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#222}.info{padding:9px 10px 11px}.title{font-size:14px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.channel{color:#8f8f9a;margin-top:5px;font-size:11px}.watch{display:none}
.language-row{display:flex;gap:10px;overflow:auto;padding:0 18px 4px;scrollbar-width:none}.language-row::-webkit-scrollbar{display:none}.language-card{min-width:170px;height:82px;border-radius:12px;padding:14px;color:#fff;display:flex;align-items:end;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.playerbar{height:58px;display:flex;align-items:center;padding:0 16px;background:#15151d}.playerbrand{font-size:20px;font-weight:900}.playerbrand span{color:var(--accent)}
#player{display:none;position:fixed;inset:0;background:#08080c;z-index:60;overflow:auto;padding:0}.playerbox{width:min(1050px,100%);margin:0 auto;background:#101017;min-height:100%}.close{margin-left:auto;width:42px;height:42px;border:0;border-radius:50%;background:#292933;color:#fff;font-size:22px}.video-wrap{background:#000;aspect-ratio:16/9;width:100%}.frame{width:100%;height:100%;border:0;display:block}.player-info{padding:16px 18px 8px}.player-title{font-size:20px;font-weight:800;line-height:1.3}.player-channel{color:#aaa;margin-top:6px}.player-actions{display:flex;gap:8px;flex-wrap:wrap;padding:8px 18px 16px}.pbtn{border:1px solid #333;background:#202027;color:#fff;border-radius:22px;padding:10px 15px;font-weight:700}.suggest-title{font-size:20px;font-weight:800;padding:10px 18px 14px;border-top:1px solid #24242c}.suggest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 18px 20px}.suggest-card{background:#191920;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #24242d}.suggest-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}.suggest-card .si{padding:8px}.suggest-card .st{font-weight:700;line-height:1.3;font-size:13px}.suggest-card .sc{color:#999;font-size:11px;margin-top:5px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:rgba(20,20,28,.96);backdrop-filter:blur(14px);border-top:1px solid #2a2a34;display:flex;justify-content:space-around;align-items:center;z-index:40}.nav-btn{border:0;background:none;color:#777;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}.nav-icon{font-size:24px;line-height:1}.nav-btn.active{color:#ffd16a}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.suggest-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{border-radius:0 0 34px 34px}.language-card{min-width:210px}}
@media(max-width:430px){.hero{min-height:440px;height:58vh}.hero-title{font-size:34px}.section{font-size:21px}.chips{gap:24px}.chips button{font-size:16px}}
</style>
</head>
<body>
<header>
<div class="row"><input id="q" placeholder="Search movies, shows & stories" onkeydown="if(event.key==='Enter')search()"><button onclick="search()" aria-label="Search">SEARCH</button></div>
<div class="chips">
<button onclick="showHome()">Home</button><button onclick="setQ('Hollywood full movie')">Shows</button><button onclick="setQ('full movie')">Movie</button><button onclick="setQ('anime long story')">Anime</button><button onclick="setQ('South Indian full movie')">South</button><button onclick="setQ('Bangla full movie')">Bangla</button>
</div>
</header>
<main>
<section id="home">
<div id="hero" class="hero"><div class="hero-content"><div class="hero-title">Discover Movies</div><div class="hero-sub">Hollywood • Bollywood • South • Bangla • Hindi • Long Stories</div><button class="hero-play" onclick="setQ('new full movie')">▶ PLAY MOVIES</button></div></div>
<div class="section">Explore In Your Language</div>
<div class="language-row">
<div class="language-card" style="background:linear-gradient(135deg,#f2a900,#d97a00)" onclick="setQ('Hindi full movie')">हिन्दी</div>
<div class="language-card" style="background:linear-gradient(135deg,#e4bd00,#9d8700)" onclick="setQ('Tamil full movie')">தமிழ்</div>
<div class="language-card" style="background:linear-gradient(135deg,#28a745,#137333)" onclick="setQ('Telugu full movie')">తెలుగు</div>
<div class="language-card" style="background:linear-gradient(135deg,#8b55d9,#54328f)" onclick="setQ('Bangla full movie')">বাংলা</div>
<div class="language-card" style="background:linear-gradient(135deg,#d44a45,#8f2420)" onclick="setQ('Malayalam full movie')">മലയാളം</div>
</div>
<div class="section">Watch Popular Movies ›</div>
<div id="homeMovies" class="grid"><div class="msg">Loading movies…</div></div>
</section>
<section id="results"><div class="msg">Search for a movie or long story.</div></section>
</main>
<div class="bottom-nav">
<button class="nav-btn active" onclick="showHome()"><span class="nav-icon">⌂</span>Home</button>
<button class="nav-btn" onclick="document.getElementById('q').focus()"><span class="nav-icon">◉</span>Find</button>
<button class="nav-btn" onclick="setQ('new movie')"><span class="nav-icon">▣</span>TV</button>
<button class="nav-btn" onclick="setQ('full movie')"><span class="nav-icon">⇩</span>Movies</button>
<button class="nav-btn" onclick="showHome()"><span class="nav-icon">☻</span>Me</button>
</div>
<div id="player">
<div class="playerbox">
  <div class="playerbar"><div class="playerbrand">▶ <span>Biswa</span>Tube</div><button class="close" onclick="closePlayer()">✕</button></div>
  <div class="video-wrap"><iframe id="frame" class="frame" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>
  <div class="player-info"><div id="playerTitle" class="player-title">BiswaTube Player</div><div id="playerChannel" class="player-channel"></div></div>
  <div class="player-actions"><button class="pbtn">👍 Like</button><button class="pbtn">↗ Share</button><button class="pbtn">🔖 Save</button><button class="pbtn">▶ Subscribe</button></div>
  <div class="suggest-title">Suggested Videos</div>
  <div id="suggestions" class="suggest-grid"></div>
</div>
</div>
<script>
const API_KEY='AIzaSyBkmGRMcQog-vOPIJye4ne1ssg3qGeYQDw';

let currentItems=[];
function showHome(){document.getElementById('home').style.display='block';document.getElementById('results').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function setQ(x){document.getElementById('q').value=x;search()}

const HOME_QUERIES=['new full movie Hollywood','new full movie Bollywood','new South Indian full movie','new Bangla full movie','new Hindi full movie','new long story movie','new Malayalam full movie'];
async function loadHome(){
  const box=document.getElementById('homeMovies');
  try{
    const batches=await Promise.all(HOME_QUERIES.map(q=>api(q,4)));
    const all=batches.flat().filter(isMovieLongStory);
    const seen=new Set(); const unique=all.filter(v=>{const id=v.id.videoId;if(seen.has(id))return false;seen.add(id);return true});
    box.innerHTML='';
    unique.slice(0,18).forEach(v=>box.appendChild(card(v)));
    if(!unique.length)box.innerHTML='<div class="msg">No movie suggestions found right now.</div>';
  }catch(e){box.innerHTML='<div class="msg">Could not load movie suggestions. Search is still available.</div>'}
}
function movieQuery(q){
  const clean=q.trim();
  return clean+' (movie OR film OR "full movie" OR "full film" OR "long story" OR story) -song -music -shorts -short -gaming -game -sports -football -cricket -funny';
}
function isMovieLongStory(v){
  const s=(v.snippet.title+' '+v.snippet.description+' '+v.snippet.channelTitle).toLowerCase();
  const positive=['movie','film','full movie','full film','long story','story','cinema'];
  const negative=['#shorts','shorts','song','official music','lyric','lyrics','gaming','gameplay','football','cricket','sports','funny clip'];
  const hasPositive=positive.some(x=>s.includes(x));
  const hasNegative=negative.some(x=>s.includes(x));
  return hasPositive && !hasNegative;
}
function renderSuggestions(currentId){
  const box=document.getElementById('suggestions'); if(!box)return; box.innerHTML='';
  currentItems.filter(v=>v.id.videoId!==currentId).slice(0,8).forEach(v=>{
    const id=v.id.videoId,s=v.snippet;
    const c=document.createElement('div'); c.className='suggest-card';
    c.innerHTML='<img src="'+(s.thumbnails.medium?.url||s.thumbnails.high?.url||'')+'"><div class="si"><div class="st"></div><div class="sc"></div></div>';
    c.querySelector('.st').textContent=s.title;c.querySelector('.sc').textContent=s.channelTitle;
    c.onclick=()=>openPlayer(id,s.title,s.channelTitle);box.appendChild(c);
  });
}
function openPlayer(id,title='',channel=''){
      document.getElementById('frame').src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';
      document.getElementById('playerTitle').textContent=title||'BiswaTube Player';
      document.getElementById('playerChannel').textContent=channel||'';
      document.getElementById('player').style.display='block';
      renderSuggestions(id);
    }
function closePlayer(){document.getElementById('frame').src='';document.getElementById('player').style.display='none'}
function card(v){
 const id=v.id.videoId,s=v.snippet;
 const c=document.createElement('div');c.className='card';
 c.innerHTML='<img class="thumb" src="'+(s.thumbnails.high?.url||s.thumbnails.medium?.url||'')+'"><div class="info"><div class="title"></div><div class="channel"></div><button class="watch">▶ WATCH</button></div>';
 c.querySelector('.title').textContent=s.title;c.querySelector('.channel').textContent=s.channelTitle;
 c.onclick=()=>openPlayer(id,s.title,s.channelTitle);
 c.querySelector('.watch').onclick=(e)=>{e.stopPropagation();openPlayer(id,s.title,s.channelTitle)};
 return c
}
async function api(q,max=12){
 const u=new URL('https://www.googleapis.com/youtube/v3/search');
 u.searchParams.set('part','snippet');u.searchParams.set('type','video');u.searchParams.set('q',q);u.searchParams.set('maxResults',max);u.searchParams.set('key',API_KEY);
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);
 try{const r=await fetch(u,{signal:controller.signal});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'YouTube API error');return d.items||[]}
 finally{clearTimeout(timer)}
}
async function search(){
 const q=document.getElementById('q').value.trim();if(!q)return;
 document.getElementById('home').style.display='none';
 const out=document.getElementById('results');out.innerHTML='<div class="msg">Searching YouTube…</div>';
 try{const raw=await api(movieQuery(q));const items=raw.filter(isMovieLongStory);render('Movies & Long Stories',items)}catch(e){out.innerHTML='<div class="msg">Search failed: '+(e.name==='AbortError'?'Request timed out. Check the API key and restrictions.':e.message)+'</div>'}
}
function render(title,items){
 currentItems=items;
 const out=document.getElementById('results');out.innerHTML='<div class="section">'+title+'</div>';
 const grid=document.createElement('div');grid.className='grid';items.forEach(v=>grid.appendChild(card(v)));out.appendChild(grid);
 if(!items.length)out.innerHTML+='<div class="msg">No videos found.</div>'
}
loadHome();
</script>
</body></html>
