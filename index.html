<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiswaTube</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#111;padding:16px;z-index:5;border-bottom:1px solid #222}h1{margin:0 0 12px;font-size:28px}
.row{display:flex;gap:8px}.row input{flex:1;padding:13px;border:0;border-radius:8px;background:#292929;color:#fff;font-size:16px;outline:none}.row button{padding:0 16px;border:0;border-radius:8px;background:#e00000;color:#fff;font-weight:bold}
.chips{display:flex;gap:8px;overflow:auto;margin-top:12px}.chips button{white-space:nowrap;border:1px solid #555;background:#222;color:#fff;border-radius:20px;padding:8px 14px}
main{padding:16px;max-width:900px;margin:auto}.msg{padding:32px 5px;color:#aaa}.section{font-size:21px;font-weight:bold;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#181818;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #000}
.thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#333}.info{padding:12px}.title{font-size:16px;font-weight:bold;line-height:1.35}.channel{color:#aaa;margin:7px 0 10px;font-size:13px}.watch{background:#e00000;color:#fff;border:0;border-radius:7px;padding:9px 13px;font-weight:bold}
#player{display:none;position:fixed;inset:0;background:#000;z-index:20}.playerbar{height:52px;display:flex;align-items:center;padding:0 12px;background:#111}.close{margin-left:auto;background:#333;color:#fff;border:0;border-radius:6px;padding:8px 12px}.frame{width:100%;height:calc(100% - 52px);border:0}
</style>
</head>
<body>
<header>
<h1>▶ BiswaTube</h1>
<div class="row"><input id="q" placeholder="Search YouTube videos" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">SEARCH</button></div>
<div class="chips">
<button onclick="setQ('popular music')">Music</button><button onclick="setQ('gaming')">Gaming</button><button onclick="setQ('popular movies trailers')">Movies</button><button onclick="setQ('sports highlights')">Sports</button><button onclick="setQ('funny videos')">Funny</button>
</div>
</header>
<main id="results"><div class="msg">Loading suggested videos…</div></main>
<div id="player"><div class="playerbar"><b>BiswaTube Player</b><button class="close" onclick="closePlayer()">✕ CLOSE</button></div><iframe id="frame" class="frame" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>
<script>
const 'AIzaSyDOPzNA5jdbgST7aQP7PSQoLYyQWJ72b8A;

function setQ(x){document.getElementById('q').value=x;search()}
function openPlayer(id){document.getElementById('frame').src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';document.getElementById('player').style.display='block'}
function closePlayer(){document.getElementById('frame').src='';document.getElementById('player').style.display='none'}
function card(v){
 const id=v.id.videoId,s=v.snippet;
 const c=document.createElement('div');c.className='card';
 c.innerHTML='<img class="thumb" src="'+(s.thumbnails.high?.url||s.thumbnails.medium?.url||'')+'"><div class="info"><div class="title"></div><div class="channel"></div><button class="watch">▶ WATCH</button></div>';
 c.querySelector('.title').textContent=s.title;c.querySelector('.channel').textContent=s.channelTitle;c.querySelector('.watch').onclick=()=>openPlayer(id);
 return c
}
async function api(q,max=12){
 const u=new URL('https://www.googleapis.com/youtube/v3/search');
 u.searchParams.set('part','snippet');u.searchParams.set('type','video');u.searchParams.set('q',q);u.searchParams.set('maxResults',max);u.searchParams.set('key',API_KEY);
 const r=await fetch(u);const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'YouTube API error');return d.items||[]
}
async function search(){
 const q=document.getElementById('q').value.trim();if(!q)return;
 const out=document.getElementById('results');out.innerHTML='<div class="msg">Searching YouTube…</div>';
 try{const items=await api(q);render('Search results',items)}catch(e){out.innerHTML='<div class="msg">Search failed: '+e.message+'</div>'}
}
async function home(){
 const out=document.getElementById('results');
 try{const items=await api('popular videos',12);render('Suggested videos',items)}
 catch(e){out.innerHTML='<div class="msg">Suggested videos are waiting for the API key.<br><br>After the key is added, this section will automatically show YouTube suggestions.</div>'}
}
function render(title,items){
 const out=document.getElementById('results');out.innerHTML='<div class="section">'+title+'</div>';
 const grid=document.createElement('div');grid.className='grid';items.forEach(v=>grid.appendChild(card(v)));out.appendChild(grid);
 if(!items.length)out.innerHTML+='<div class="msg">No videos found.</div>'
}
home();
</script>
</body></html>
